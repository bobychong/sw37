<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>传奇登陆器 - 链接页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #111;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        .container {
            width: 560px;
            height: 260px;
            background-color: #000000;
            border: 2px solid #8B0000;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .title {
            color: #ff0000;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
            animation: pulse 2s infinite;
        }
        
        .link-box {
            background: rgba(139, 0, 0, 0.2);
            border: 1px solid #ff0000;
            padding: 12px 25px;
            margin: 15px 0;
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        .link-box:hover {
            background: rgba(139, 0, 0, 0.4);
            transform: scale(1.05);
        }
        
        .website {
            color: #ff0000;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
            letter-spacing: 1px;
        }
        
        .website:hover {
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.9);
        }
        
        .contact {
            color: #ff0000;
            font-size: 18px;
            margin-top: 10px;
        }
        
        .qq {
            color: #ffcc00;
            font-weight: bold;
        }
        
        .decoration {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }
        
        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #ff0000;
        }
        
        .corner-tl {
            top: 10px;
            left: 10px;
            border-right: none;
            border-bottom: none;
        }
        
        .corner-tr {
            top: 10px;
            right: 10px;
            border-left: none;
            border-bottom: none;
        }
        
        .corner-bl {
            bottom: 10px;
            left: 10px;
            border-right: none;
            border-top: none;
        }
        
        .corner-br {
            bottom: 10px;
            right: 10px;
            border-left: none;
            border-top: none;
        }
        
        .line {
            position: absolute;
            background: linear-gradient(90deg, transparent, #ff0000, transparent);
            height: 1px;
            width: 80%;
            left: 10%;
            bottom: 60px;
            opacity: 0.7;
        }
        
        @keyframes pulse {
            0% { text-shadow: 0 0 5px rgba(255, 0, 0, 0.7); }
            50% { text-shadow: 0 0 15px rgba(255, 0, 0, 0.9); }
            100% { text-shadow: 0 0 5px rgba(255, 0, 0, 0.7); }
        }
        
        .flame {
            position: absolute;
            width: 100%;
            height: 5px;
            bottom: 0;
            background: linear-gradient(90deg, #ff0000, #ff6600, #ff0000);
            opacity: 0.7;
            animation: flame 1.5s infinite;
        }
        
        @keyframes flame {
            0% { opacity: 0.4; }
            50% { opacity: 0.8; }
            100% { opacity: 0.4; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="decoration">
            <div class="corner corner-tl"></div>
            <div class="corner corner-tr"></div>
            <div class="corner corner-bl"></div>
            <div class="corner corner-br"></div>
            <div class="line"></div>
            <div class="flame"></div>
        </div>
        
        <h1 class="title">176 神兵复古</h1>
         
        <div class="link-box">
            <a href="http://www.sw37.com" class="website" target="_blank">WWW.SW37.COM</a>
        </div>
        
        <p class="contact">客服联系 <span class="qq">QQ：901375</span></p>
    </div>
</body>
</html>
